[package]
name = "cowboy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cowboy_cli"
path = "src/lib.rs"

[[bin]]
name = "cowboy"
path = "src/main.rs"

[[bin]]
name = "cowboyd"
path = "src/bin/cowboyd.rs"

[dependencies]
cowboy-core.workspace = true
cowboy-sandbox.workspace = true
cowboy-gateway.workspace = true
cowboy-tui.workspace = true
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
schemars.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio-util.workspace = true
libc.workspace = true
nix.workspace = true
rpassword.workspace = true
similar.workspace = true
regex.workspace = true    # `grep` tool engine (no dependency on the host having rg)
walkdir.workspace = true  # `grep` tool directory traversal
rmcp.workspace = true
sha2.workspace = true
base64.workspace = true
reqwest.workspace = true  # default HTTP client for MCP streamable-HTTP transport
uuid.workspace = true     # per-session control-channel token
axum.workspace = true     # `cowboy web` remote-control server
rust-embed.workspace = true  # embed the trunk-built web UI bundle
qrcode.workspace = true   # terminal QR of the `cowboy web` access URL
# Typed Docker API. Default features = `http` + `pipe` (unix socket via hyperlocal
# / Windows named pipe); `ssl` (rustls) is deliberately left off — cowboy talks to
# the local daemon, not a TLS-remote one.

# The Linux boundary (Landlock + seccomp, applied by the shim). macOS confines with
# Seatbelt through `sandbox_init` in libSystem, which needs no crate.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

# The macOS egress proxy parses request heads itself (the gateway already uses it).
[target.'cfg(target_os = "macos")'.dependencies]
httparse.workspace = true

[dev-dependencies]
async-trait.workspace = true
assert_cmd.workspace = true
assert_fs.workspace = true
predicates.workspace = true
insta.workspace = true
tokio.workspace = true
libc.workspace = true
tokio-tungstenite.workspace = true  # WS client for `cowboy web` bridge tests
futures.workspace = true
