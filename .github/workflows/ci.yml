name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The sandbox is the security boundary, so CI runs its tests for real rather
      # than letting them self-skip. Two prerequisites, and installing only the first
      # is the trap: Ubuntu 23.10+ gates unprivileged user namespaces behind AppArmor
      # (`kernel.apparmor_restrict_unprivileged_userns=1`), so bwrap is present and
      # every sandbox operation still fails with
      # `write failed /proc/self/uid_map: Operation not permitted`.
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Tolerant: the knob only exists on AppArmor kernels that restrict userns.
          # Its absence is fine; what matters is the smoke test below, which is the
          # same "check by doing" the sandbox preflight uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind /usr /usr \
                --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /usr/bin/true
          echo "bubblewrap works unprivileged here"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `COWBOY_SANDBOX_TESTS=required` turns every sandbox self-skip into a failure.
      # Without it this suite passes on a runner that cannot sandbox at all, which is
      # the one place the coverage matters most — a green tick for tests that did
      # nothing. Tests needing a real model provider are `#[ignore]`; run those
      # manually (see AGENTS.md).
      - name: Tests
        env:
          COWBOY_SANDBOX_TESTS: required
        run: cargo test --workspace

      - name: Doctests
        run: cargo test --doc

  web-ui:
    name: build web UI (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (+ wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # Build the WASM bundle, then build the binary so the rust-embed of the
      # real bundle is exercised end-to-end (not just the empty-dist fallback).
      - name: Build web UI bundle
        run: trunk build --release
        working-directory: crates/cowboy-web-ui

      - name: Build cowboy with the bundle embedded
        run: cargo build -p cowboy-cli

      # "It compiled" is not the same as "the bundle is in there": the embed is a
      # derive macro reading `dist/`, and a missing bundle falls back to a
      # placeholder page without failing the build. `required` makes that a failure
      # instead of a skip.
      - name: Check the bundle was embedded
        env:
          COWBOY_WEB_UI_TESTS: required
        run: cargo test -p cowboy-cli --lib the_web_ui_bundle_is_embedded

  docs:
    name: build docs (mdbook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      # Fails on broken links / missing SUMMARY entries — the CLI-reference drift
      # guard runs as a normal test in the `check` job.
      - name: Build the book
        run: mdbook build docs

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full commit history, not just the tip

      # Fails the build if any credential-shaped string is found in the tree or
      # history. Free for public repos (no GITLEAKS_LICENSE needed). Config +
      # allowlist of known test placeholders live in `.gitleaks.toml`.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
